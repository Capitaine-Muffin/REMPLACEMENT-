# Construit l'application et la publie sur GitHub Pages a chaque modification.
name: Mise en ligne

on:
  push:
    branches:
      - claude/midwife-billing-app-7emiuu
      - main
  # Permet aussi de relancer la mise en ligne a la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne a la fois ; la plus recente gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # On ne met pas en ligne une version dont les calculs sont casses.
      - name: Verifier les calculs
        run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages automatiquement si ce n'est pas deja fait.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  mettre_en_ligne:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
